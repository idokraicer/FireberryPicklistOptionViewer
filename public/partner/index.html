<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fireberry — סביבות</title><link rel="stylesheet" href="popup.css"><body><h1 class="partner-heading">הסביבות שלי</h1><main><label for="search">חיפוש סביבה</label><input id="search" type="search" placeholder="שם סביבה או מייל"><div id="list"></div><details id="editor"><summary>הוספת סביבה</summary><form id="environment"><input id="env-id" type="hidden"><label for="name">שם הסביבה</label><input id="name" required maxlength="80" placeholder="לדוגמה: Datamap"><label for="customer">Customer Username Email</label><input id="customer" dir="ltr" type="email" required><div class="actions"><button type="submit">שמירת סביבה</button><button id="cancel" type="button" class="secondary">ביטול</button></div></form></details><details id="settings"><summary>פרטי השותף</summary><form id="partner"><label for="email">Partner Email</label><input id="email" dir="ltr" type="email" required autocomplete="username"><label for="password">Partner Password</label><input id="password" dir="ltr" type="password" autocomplete="off" required><label class="check"><input id="remember" type="checkbox">שמירת הסיסמה גם אחרי סגירת Chrome</label><p class="hint">ברירת המחדל: שמירה עד הפעלה מחדש של הדפדפן. שמירה קבועה היא מקומית ואינה כספת מוצפנת.</p><button type="submit">שמירת פרטי שותף</button><button id="forget" class="secondary" type="button">מחיקת הסיסמה השמורה</button></form></details><p id="status" role="status" aria-live="polite"></p><footer>כל הסביבות בפרופיל Chrome משתפות עוגיות. כניסה לסביבה אחרת עשויה להחליף את החשבון הפעיל.</footer></main><script src="popup.js"></script></body></html>
